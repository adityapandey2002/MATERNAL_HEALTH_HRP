name: hrp-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${HRP_DB_USER:-hrp}"
      POSTGRES_PASSWORD: "${HRP_DB_PASSWORD:?HRP_DB_PASSWORD is required}"
      POSTGRES_DB: "${HRP_DB_NAME:-hrp}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HRP_DB_USER:-hrp} -d ${HRP_DB_NAME:-hrp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: "${HRP_SERVER_IMAGE:?HRP_SERVER_IMAGE is required}"
    command: ["node", "packages/server/dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${HRP_DB_USER:-hrp}:${HRP_DB_PASSWORD:?HRP_DB_PASSWORD is required}@db:5432/${HRP_DB_NAME:-hrp}"
      JWT_SECRET: "${HRP_JWT_SECRET:?HRP_JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${HRP_JWT_REFRESH_SECRET:?HRP_JWT_REFRESH_SECRET is required}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    image: "${HRP_SERVER_IMAGE:?HRP_SERVER_IMAGE is required}"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${HRP_DB_USER:-hrp}:${HRP_DB_PASSWORD:?HRP_DB_PASSWORD is required}@db:5432/${HRP_DB_NAME:-hrp}"
      JWT_SECRET: "${HRP_JWT_SECRET:?HRP_JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${HRP_JWT_REFRESH_SECRET:?HRP_JWT_REFRESH_SECRET is required}"
      APP_VERSION: "${APP_VERSION:-unknown}"
      GIT_SHA: "${GIT_SHA:-unknown}"
      LOG_LEVEL: "${HRP_LOG_LEVEL:-info}"
      DB_POOL_MAX: "${HRP_DB_POOL_MAX:-10}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  client:
    image: "${HRP_CLIENT_IMAGE:?HRP_CLIENT_IMAGE is required}"
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HRP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
