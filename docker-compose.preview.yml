services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrp
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?PREVIEW_DB_PASSWORD is required}
      POSTGRES_DB: hrp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrp -d hrp"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["node", "packages/server/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://hrp:${PREVIEW_DB_PASSWORD:?PREVIEW_DB_PASSWORD is required}@db:5432/hrp
      JWT_SECRET: ${PREVIEW_JWT_SECRET:?PREVIEW_JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${PREVIEW_JWT_REFRESH_SECRET:?PREVIEW_JWT_REFRESH_SECRET is required}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.0}
    environment:
      DATABASE_URL: postgresql://hrp:${PREVIEW_DB_PASSWORD:?PREVIEW_DB_PASSWORD is required}@db:5432/hrp
      JWT_SECRET: ${PREVIEW_JWT_SECRET:?PREVIEW_JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${PREVIEW_JWT_REFRESH_SECRET:?PREVIEW_JWT_REFRESH_SECRET is required}
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.0.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      PORT: "3000"
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: /api
        VITE_APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PREVIEW_PORT:-8080}:8080"

volumes:
  pgdata:
