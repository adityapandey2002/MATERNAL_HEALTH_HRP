services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrp
      POSTGRES_PASSWORD: hrp_dev
      POSTGRES_DB: hrp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrp -d hrp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole repository is mounted so that the npm workspace symlinks
  # (node_modules/@hrp/shared -> packages/shared) keep resolving. The
  # anonymous volume masks the host's node_modules with the image's.
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile.dev
    working_dir: /app/packages/server
    environment:
      DATABASE_URL: postgresql://hrp:hrp_dev@db:5432/hrp
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: development
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.dev
    working_dir: /app/packages/client
    environment:
      # The client calls /api/... and Vite proxies it to the server on the same
      # origin, so the httpOnly refresh cookie works without cross-origin rules.
      # Must NOT be empty (""), otherwise requests lose the /api prefix and 404.
      VITE_API_URL: "/api"
      VITE_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
