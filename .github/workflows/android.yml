name: Android APK

# Sideloaded pilot build. Nothing here touches the shared demo: the API URL is
# supplied per run and the APK is built with the demo logins switched off.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Absolute API base URL, e.g. https://pilot-api.example.gov.in/api"
        required: true
        type: string
      version_name:
        description: "Version name shown in the app, e.g. 1.0.0"
        required: false
        default: ""
        type: string
      version_code:
        description: "Version code (must be higher than any installed build)"
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with: { node-version: '20', cache: 'npm' }

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install
        run: npm ci

      - name: Check signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Create them once from the pilot runbook before building an APK."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          # Tags win over manual input so a tagged build is reproducible.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION_NAME" ]; then
            name="$INPUT_VERSION_NAME"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          code="${INPUT_VERSION_CODE:-$GITHUB_RUN_NUMBER}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "file=matru-suraksha-${name}.apk" >> "$GITHUB_OUTPUT"
          echo "Building version $name ($code)"

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build web bundle for the device
        working-directory: packages/client
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.PILOT_API_URL }}
          VITE_NATIVE_APP: "true"
          VITE_DEMO_MODE: "false"
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          # A tag build carries no `inputs`, so the URL has to be supplied.
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::api_url is required. Pass it as a workflow input."
            exit 1
          fi
          npm run build
          npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          cat > packages/client/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 packages/client/android/keystore.properties

      - name: Assemble release
        working-directory: packages/client/android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"

      - name: Verify the APK is signed with the release key
        working-directory: packages/client/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No release APK was produced"; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Name the APK and write its checksum
        id: package
        working-directory: packages/client/android
        env:
          APK_NAME: ${{ steps.version.outputs.file }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/artifacts/$APK_NAME"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Upload APK artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matru-suraksha-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          body: |
            Matru Suraksha pilot build.

            Install `${{ steps.version.outputs.file }}` on the device, then check
            the file against `${{ steps.version.outputs.file }}.sha256` before sharing it.

      - name: Remove signing material
        if: always()
        run: |
          rm -f packages/client/android/keystore.properties
          rm -rf "$RUNNER_TEMP/keystore"
