name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks (types, lint, secrets, floor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install
        run: npm ci

      - name: Types, lint and local secret scan
        run: npm run check:fast

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  task:
    name: Task Checks (fast + coverage on changed lines)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hrp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hrp -d hrp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install
        run: npm ci

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgresql://hrp:test@localhost:5432/hrp

      - name: Run tests with coverage
        run: npm run check:task
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: postgresql://hrp:test@localhost:5432/hrp
          JWT_SECRET: test-secret-for-ci-only-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-at-least-32-characters

      - name: End-to-end smoke test
        run: |
          npm run dev:server &
          npx wait-on tcp:3000 --timeout 60000
          npm run test:smoke
        env:
          DATABASE_URL: postgresql://hrp:test@localhost:5432/hrp
          JWT_SECRET: test-secret-for-ci-only-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-at-least-32-characters

  full:
    name: Full Checks (all + security)
    needs: task
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrp
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hrp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hrp -d hrp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install
        run: npm ci

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          semgrep --version
          osv-scanner --version

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgresql://hrp:test@localhost:5432/hrp

      - name: Full gate (types, lint, secrets, coverage, semgrep, osv)
        run: npm run check:full
        env:
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: postgresql://hrp:test@localhost:5432/hrp
          JWT_SECRET: test-secret-for-ci-only-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-at-least-32-characters

  preview:
    name: Preview Deploy + Perf/A11y/Bundle
    needs: full
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build --workspace=packages/client

      - name: Deploy to Netlify Preview
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=packages/client/dist --alias=pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Wait for deploy
        run: sleep 30

      - name: Lighthouse CI
        run: |
          PREVIEW_URL=https://pr-${{ github.event.number }}.netlify.app
          npx lighthouse $PREVIEW_URL --output=json --quiet --only-categories=performance --output-path=lighthouse.json

      - name: Axe accessibility
        run: |
          PREVIEW_URL=https://pr-${{ github.event.number }}.netlify.app
          npx axe $PREVIEW_URL --tags wcag2a,wcag2aa,wcag21aa --exit

      - name: Bundle size
        run: npx size-limit --json
